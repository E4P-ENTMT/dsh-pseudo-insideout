name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.9.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build versioned installation assets
        run: npm run release:pack
      - name: Verify exact tarball in an isolated DSH host
        run: |
          npm install --prefix output/dsh-runtime --ignore-scripts --no-audit --no-fund --save-exact @deepseek-ai/dsh@0.2.2-rc.1
          node test/fixtures/verify-dsh-e2e.mjs --runtime output/dsh-runtime --tarball "output/release/dsh-pseudo-insideout-${RELEASE_TAG#v}.tgz" --output output/release-validation
      - name: Publish GitHub Release with all installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd output/release
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" "dsh-pseudo-insideout-${RELEASE_TAG#v}.tgz" INSTALL.md SHA256SUMS --verify-tag --title "$RELEASE_TAG · 记忆与状态插件" --notes-file RELEASE-NOTES.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest

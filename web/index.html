<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#17132f">
    <title>InsideOut · 记忆控制台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='15' fill='%23ffe066'/%3E%3Ccircle cx='20' cy='20' r='7' fill='%2317132f'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="控制台导航">
        <a class="brand" href="#home" aria-label="InsideOut 总部">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>INSIDEOUT<span class="brand-dot">.</span></strong><small>AGENT MEMORY CONSOLE</small></span>
        </a>
        <div class="sidebar-caption">你的记忆宇宙</div>
        <nav id="navigation" aria-label="主要导航"></nav>
        <div class="sidebar-bottom">
          <div class="preservation-mark"><span aria-hidden="true">◇</span><div><strong>记忆有去处</strong><p>退出召回，完整封存。</p></div></div>
          <div class="plugin-label">dsh-pseudo-insideout <span>v1</span></div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">控制中心 <span>/</span> <strong id="breadcrumb-title">总部</strong></div>
          <div class="topbar-right"><label class="scope-picker"><span class="visually-hidden">选择工作区与 Agent 数据范围</span><select id="scope-select" aria-label="选择工作区与 Agent 数据范围" disabled><option value="">正在读取数据范围</option></select></label><span id="connection-status" class="status-pill"><i></i> 正在连接控制台</span><button class="icon-button" id="refresh-button" type="button" title="刷新数据" aria-label="刷新数据"></button></div>
        </header>
        <main id="main" tabindex="-1" aria-live="polite"><div class="initial-loading"><span class="loading-dot"></span> 正在读取记忆控制台…</div></main>
        <footer class="footer"><span>经历被保留，理解可以生长。</span><span id="last-updated">本地数据 · 无云同步</span></footer>
      </div>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <script id="insideout-boot" type="application/json">__INSIDEOUT_BOOT__</script>
    <script src="app.js" defer></script>
  </body>
</html>
